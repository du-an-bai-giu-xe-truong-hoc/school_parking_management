[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --asyncio-mode=auto
filterwarnings =
    ignore:You are using a Python version .* end of life.*:FutureWarning
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests